name: Update OpenRouter Pricing

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-pricing:
    runs-on: ubuntu-latest
    # Only run if OPENROUTER_API_KEY secret exists
    if: ${{ secrets.OPENROUTER_API_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate pricing markdown
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ./scripts/generate-model-pricing.sh

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet OPENROUTER_MODELS.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add OPENROUTER_MODELS.md
          git commit -m "Update OpenRouter model pricing (automated)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "No pricing changes detected"
